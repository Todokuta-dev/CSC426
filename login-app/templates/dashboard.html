<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AuthApp — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d0d2b 0%, #1a0533 45%, #0d1f3c 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(70px); opacity: 0.3; pointer-events: none; z-index: 0;
    }
    .orb1 { width: 400px; height: 400px; background: #5533ff; top: -100px; left: -100px; animation: drift1 9s ease-in-out infinite; }
    .orb2 { width: 300px; height: 300px; background: #cc00ff; bottom: -80px; right: -60px; animation: drift2 11s ease-in-out infinite; }
    @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,30px)} }
    @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,-40px)} }

    .card {
      position: relative; z-index: 2;
      width: 100%; max-width: 440px; margin: 1rem;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.13);
      padding: 40px 36px;
      box-shadow: 0 12px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: fadeUp 0.5s ease both;
      text-align: center;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    .avatar {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #5533cc, #8833ff);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 600; color: #fff;
      margin: 0 auto 20px;
      box-shadow: 0 4px 24px rgba(100,40,255,0.4);
    }

    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
    .logo-dot {
      width: 10px; height: 10px; background: #8844ff; border-radius: 50%;
      box-shadow: 0 0 10px #8844ff, 0 0 20px rgba(136,68,255,0.5);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
    .logo-text { font-size: 13px; font-weight: 500; color: rgba(180,150,255,0.6); letter-spacing: 4px; text-transform: uppercase; }

    h1 { font-size: 24px; font-weight: 600; color: #f0eeff; margin-bottom: 8px; }
    .sub { font-size: 14px; color: rgba(180,160,220,0.55); margin-bottom: 32px; }

    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px;
    }
    .info-card {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px;
      text-align: left;
    }
    .info-label { font-size: 11px; color: rgba(180,155,230,0.5); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 4px; }
    .info-value { font-size: 15px; font-weight: 500; color: #d0b8ff; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(40,200,120,0.1);
      border: 1px solid rgba(60,220,140,0.2);
      color: #60e0a0;
      font-size: 13px; font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 28px;
    }
    .badge-dot { width: 7px; height: 7px; background: #60e0a0; border-radius: 50%; animation: pulse 2s infinite; }

    .btn-logout {
      width: 100%;
      padding: 13px;
      background: rgba(255,60,100,0.1);
      color: #ff80a0;
      border: 1px solid rgba(255,80,120,0.2);
      border-radius: 14px;
      font-size: 15px; font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-logout:hover { background: rgba(255,60,100,0.2); box-shadow: 0 0 20px rgba(255,60,100,0.2); }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">AuthApp</span>
    </div>

    <div class="avatar" id="avatar">?</div>

    <h1>Hey, {{ username }}! 👋</h1>
    <p class="sub">You're successfully logged in.</p>

    <div class="badge">
      <div class="badge-dot"></div>
      Session active
    </div>

    <div class="info-grid">
      <div class="info-card">
        <div class="info-label">Username</div>
        <div class="info-value">{{ username }}</div>
      </div>
      <div class="info-card">
        <div class="info-label">Status</div>
        <div class="info-value" style="color:#60e0a0">Authenticated</div>
      </div>
    </div>

    <button class="btn-logout" onclick="logout()">Log out</button>
  </div>

  <script>
    const name = "{{ username }}";
    document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }
  </script>
</body>
</html>
